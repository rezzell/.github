name: Choose Runner

on:
  workflow_call:
    inputs:
      organization:
        description: GitHub organization that owns the runner scale set
        required: true
        type: string
      scale-set-name:
        description: Runner scale set name to prefer when online
        required: true
        type: string
      fallback-runner:
        description: GitHub-hosted fallback runner label
        required: true
        type: string
    secrets:
      org-runners-read-token:
        description: Fine-grained token with Self-hosted runners organization read permission
        required: false
    outputs:
      runner:
        description: JSON array suitable for runs-on
        value: ${{ jobs.choose.outputs.runner }}

permissions:
  contents: read

jobs:
  choose:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.select.outputs.runner }}
    steps:
      - name: Resolve workflow repository source
        id: workflow-source
        env:
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          echo "repository=${GITHUB_WORKFLOW_REF%%/.github/workflows/*}" >> "${GITHUB_OUTPUT}"
          echo "ref=${GITHUB_WORKFLOW_REF##*@}" >> "${GITHUB_OUTPUT}"
      - name: Check out workflow repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ steps.workflow-source.outputs.repository }}
          ref: ${{ steps.workflow-source.outputs.ref }}
          path: workflow-repo
      - name: Select runner target
        id: select
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GH_TOKEN: ${{ secrets.org-runners-read-token }}
          ORGANIZATION: ${{ inputs.organization }}
          SCALE_SET_NAME: ${{ inputs.scale-set-name }}
          FALLBACK_RUNNER: ${{ inputs.fallback-runner }}
        run: |
          set -euo pipefail
          ./workflow-repo/.github/scripts/choose-runner.sh >> "${GITHUB_OUTPUT}"
