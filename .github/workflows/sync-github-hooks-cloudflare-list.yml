name: Sync GitHub Hooks Cloudflare List

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Resolve ranges without updating Cloudflare.
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_GITHUB_HOOKS_LIST_ID: ${{ secrets.CLOUDFLARE_GITHUB_HOOKS_LIST_ID }}
    steps:
      - name: Check required secrets
        id: secrets
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${CLOUDFLARE_API_TOKEN}" && -n "${CLOUDFLARE_ACCOUNT_ID}" && -n "${CLOUDFLARE_GITHUB_HOOKS_LIST_ID}" ]]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "Cloudflare list sync skipped because one or more required secrets are not configured."
          fi

      - name: Sync GitHub webhook ranges
        if: steps.secrets.outputs.configured == 'true'
        uses: rezzell/cloudflare-ip-list-sync-action@v1
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-list-id: ${{ secrets.CLOUDFLARE_GITHUB_HOOKS_LIST_ID }}
          github-token: ${{ github.token }}
          sources: |
            [
              {
                "type": "github-meta",
                "keys": ["hooks"]
              }
            ]
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
